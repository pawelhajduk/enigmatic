[project]
name = "enigmatic"
version = "0.1.0"
description = "Local anonymizing LLM proxy: Presidio placeholders in front of OpenAI-compatible, Anthropic, and agent CLIs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Enigmatic" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "typer>=0.15.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "presidio-analyzer>=2.2.355",
  "presidio-anonymizer>=2.2.355",
  "presidio-image-redactor>=0.0.57",
  "pillow>=10.0.0",
  "python-multipart>=0.0.12",
  "agent-client-protocol>=0.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[project.scripts]
enigmatic = "enigmatic.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enigmatic"]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
